[phases.setup]
# Hostinger VPS supports Python 3.11/3.12
nixPkgs = ["python311"]

# Hostinger uses standard Debian/Ubuntu names for packages
aptPkgs = [
    "ffmpeg", 
    "libsm6", 
    "libxext6", 
    "libgl1-mesa-glx", 
    "libglib2.0-0", 
    "libxrender1", 
    "tesseract-ocr"
]

[phases.install]
# Ensure we have the right server tools for production
cmds = [
    "python -m pip install -r requirements.txt",
    "python -m pip install gunicorn uvicorn"
]

[start]
# Use Gunicorn for high traffic and better stability on a VPS
# If your file is main1.py, keep main1:app. If it is main.py, change to main:app
cmd = "gunicorn main1:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000"