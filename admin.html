<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KYC Admin Dashboard</title>
    <style>
        :root { --bg: #0f0f0f; --card: #1a1a1a; --primary: #007bff; --success: #28a745; --warning: #ffc107; --danger: #dc3545; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        
        .container { max-width: 1000px; margin: auto; }
        h1 { border-bottom: 2px solid #333; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        
        .table-box { background: var(--card); border-radius: 10px; overflow: hidden; margin-top: 20px; border: 1px solid #333; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 15px; border-bottom: 1px solid #333; }
        th { background: #252525; color: var(--primary); }
        
        .status-badge { padding: 5px 10px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
        .APPROVED { background: rgba(40, 167, 69, 0.2); color: #28a745; }
        .PENDING { background: rgba(255, 193, 7, 0.2); color: #ffc107; }
        .REJECTED { background: rgba(220, 53, 69, 0.2); color: #dc3545; }

        .btn-detail { background: var(--primary); color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }

        /* MODAL STYLES */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); align-items: center; justify-content: center; z-index: 100; }
        .modal-content { background: var(--card); padding: 25px; border-radius: 15px; width: 90%; max-width: 800px; position: relative; }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 2rem; cursor: pointer; color: #888; }
        
        .comparison-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .img-wrap { text-align: center; }
        .img-wrap img { width: 100%; border-radius: 10px; border: 2px solid #444; margin-top: 10px; }
        
        .modal-actions { margin-top: 25px; display: flex; gap: 10px; }
        .modal-actions button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h1>
        KYC User Management
        <button onclick="fetchUsers()" style="font-size: 0.9rem; padding: 5px 10px; cursor: pointer;">🔄 Refresh</button>
    </h1>

    <div class="table-box">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Document</th>
                    <th>Distance</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="user-table-body">
                </tbody>
        </table>
    </div>
</div>

<div id="detailModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h2 id="modal-title">User Details</h2>
        <div id="modal-info"></div>

        <div class="comparison-grid">
            <div class="img-wrap">
                <strong>ID CARD (CNIC)</strong>
                <img id="modal-cnic" src="" alt="CNIC">
            </div>
            <div class="img-wrap">
                <strong>LIVE SELFIE</strong>
                <img id="modal-selfie" src="" alt="Selfie">
            </div>
        </div>

        <div id="action-buttons" class="modal-actions">
            <button style="background: var(--success); color: white;" onclick="submitAction('approve')">APPROVE USER</button>
            <button style="background: var(--danger); color: white;" onclick="submitAction('reject')">REJECT USER</button>
        </div>
    </div>
</div>

<script>
    const API_URL = "https://osama347-kyc-verification.hf.space";
    let selectedUserId = null;
    let allRequests = [];

    async function fetchUsers() {
        try {
            // We fetch pending requests and you can add an endpoint for 'all' if needed
            const res = await fetch(`${API_URL}/admin/pending`);
            const data = await res.json();
            allRequests = data.requests;
            renderTable(allRequests);
        } catch (e) { console.error("Error fetching data", e); }
    }

    function renderTable(requests) {
        const body = document.getElementById("user-table-body");
        body.innerHTML = requests.map(req => `
            <tr>
                <td>#${req.id}</td>
                <td>${req.doc_type}</td>
                <td>${req.distance.toFixed(4)}</td>
                <td><span class="status-badge ${req.status}">${req.status}</span></td>
                <td><button class="btn-detail" onclick="showDetails(${req.id})">Details</button></td>
            </tr>
        `).join("");
    }

    function showDetails(id) {
        const user = allRequests.find(r => r.id === id);
        if (!user) return;
        
        selectedUserId = id;
        document.getElementById("modal-title").innerText = `Reviewing ID #${id}`;
        document.getElementById("modal-info").innerHTML = `Type: ${user.doc_type} | AI Distance: ${user.distance.toFixed(4)}`;
        
        // Build full image URLs
        document.getElementById("modal-cnic").src = `${API_URL}/${user.cnic_path}`;
        document.getElementById("modal-selfie").src = `${API_URL}/${user.selfie_path}`;

        document.getElementById("detailModal").style.display = "flex";
    }

    function closeModal() {
        document.getElementById("detailModal").style.display = "none";
    }

    async function submitAction(action) {
        const fd = new FormData();
        fd.append("id", selectedUserId);
        fd.append("action", action);

        const res = await fetch(`${API_URL}/admin/action`, { method: "POST", body: fd });
        if (res.ok) {
            alert(`User ${action.toUpperCase()}ED`);
            closeModal();
            fetchUsers();
        }
    }

    window.onclick = (event) => {
        if (event.target == document.getElementById("detailModal")) closeModal();
    }

    // Initial Load
    fetchUsers();
</script>
</body>
</html>
