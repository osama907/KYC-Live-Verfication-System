[phases.setup]
# We install all possible system libraries to be safe
nixPkgs = ["python311", "ffmpeg", "glib", "libGL", "libXext", "libXrender", "libICE", "libSM", "xorg.libxcb", "xorg.libX11"]

[phases.install]
# 1. Install dependencies
# 2. FORCE UNINSTALL the standard opencv-python that DeepFace installs
cmds = [
    "python -m pip install -r requirements.txt",
    "python -m pip uninstall -y opencv-python"
]

[start]
cmd = "uvicorn main1:app --host 0.0.0.0 --port $PORT"